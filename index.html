<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer voice reel | UiPath Global Product Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FA4616;
    --orange-alt:#FB6B45;
    --teal:#0BA2B3;
    --teal-mid:#3CB5C2;
    --deep:#182126;
    --deep2:#2D373C;
    --deep3:#3C464B;
    --deep-mid:#646E78;
    --deep-light:#A0AAB9;
    --white:#FFFFFF;
    --head:'Poppins','Arial',sans-serif;
    --body:'Inter','Arial',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--deep);
    color:var(--white);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:22px 40px 18px;
    border-bottom:1px solid var(--deep3);
    flex-wrap:wrap;
  }
  .brandblock{display:flex;align-items:center;gap:18px;}
  .logo{height:26px;width:auto;display:block;}
  .brandblock .divider{width:1px;height:20px;background:var(--deep3);flex:none;}
  .eyebrow{
    font-family:var(--head);
    font-weight:600;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--teal-mid);
  }
  .pixelrow{display:flex;gap:5px;}
  .pixelrow i{width:9px;height:9px;display:block;}

  /* ---------- Stage ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:44px 40px 24px;
    max-width:1180px;
    width:100%;
    margin:0 auto;
  }
  .kicker{
    font-family:var(--head);
    font-weight:700;
    font-size:clamp(20px,2.6vw,30px);
    letter-spacing:-0.03em;
    margin:0 0 6px;
  }
  .kicker span{color:var(--orange);}
  .kicker{margin-bottom:26px;}
  .subline{
    font-size:13.5px;
    color:var(--deep-light);
    margin:0 0 26px;
    max-width:640px;
    line-height:1.55;
  }

  .card{
    position:relative;
    background:var(--deep2);
    border:1px solid var(--deep3);
    border-radius:4px;
    padding:46px 52px 40px;
    overflow:hidden;
    min-height:340px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .rail{
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:var(--deep3);
  }
  .rail b{
    display:block;
    height:100%;
    width:0%;
    background:var(--orange);
  }
  .mark{
    position:absolute;
    top:26px;
    right:40px;
    font-family:var(--head);
    font-weight:900;
    font-size:120px;
    line-height:.7;
    color:var(--deep3);
    user-select:none;
    pointer-events:none;
  }
  .quotewrap{position:relative;z-index:2;}
  blockquote{
    margin:0;
    font-family:var(--head);
    font-weight:600;
    letter-spacing:-0.025em;
    line-height:1.34;
    font-size:clamp(19px,2.35vw,31px);
    color:var(--white);
    transition:opacity .45s ease, transform .45s ease;
  }
  blockquote.out{opacity:0;transform:translateY(14px);}
  .meta{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:28px;
    transition:opacity .45s ease;
  }
  .meta.out{opacity:0;}
  .meta .bar{width:26px;height:3px;background:var(--teal);flex:none;}
  .meta .acct{
    font-family:var(--head);
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--white);
  }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:22px;
    flex-wrap:wrap;
  }
  button{
    font-family:var(--body);
    cursor:pointer;
    border:1px solid var(--deep3);
    background:transparent;
    color:var(--white);
    height:38px;
    min-width:38px;
    padding:0 12px;
    border-radius:3px;
    font-size:13px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:border-color .18s, background .18s, color .18s;
  }
  button:hover{border-color:var(--teal);color:var(--teal-mid);}
  button:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
  button.primary{background:var(--orange);border-color:var(--orange);}
  button.primary:hover{background:var(--orange-alt);border-color:var(--orange-alt);color:var(--white);}
  .count{
    font-family:var(--head);
    font-weight:700;
    font-size:13px;
    letter-spacing:.06em;
    color:var(--deep-light);
    min-width:66px;
  }
  .count em{color:var(--white);font-style:normal;}
  .dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
  .dots i{
    width:9px;height:9px;
    background:var(--deep3);
    display:block;
    cursor:pointer;
    transition:background .2s, transform .2s;
  }
  .dots i:hover{transform:scale(1.25);}
  .dots i.on{background:var(--orange);}


  @media (max-width:760px){
    .topbar{padding:18px 22px 14px;}
    .stage{padding:28px 22px 18px;}
    .card{padding:34px 24px 30px;min-height:300px;}
    .mark{font-size:74px;top:16px;right:20px;}
    .dots{margin-left:0;width:100%;}
    @media (prefers-reduced-motion:reduce){
    blockquote,.meta{transition:none;}
    .dots i{transition:none;}
  }
</style>
</head>

<main class="stage">
  <h1 class="kicker">In our customers' <span>own words.</span></h1>

  <section class="card" id="card" aria-live="polite" aria-atomic="true">
    <div class="rail"><b id="rail"></b></div>
    <div class="mark" aria-hidden="true">&ldquo;</div>
    <div class="quotewrap">
      <blockquote id="quote"></blockquote>
      <div class="meta" id="meta">
        <span class="bar" aria-hidden="true"></span>
        <span class="acct" id="acct"></span>
      </div>
    </div>
  </section>

  <div class="controls">
    <button id="prev" aria-label="Previous comment">&#9664;</button>
    <button id="toggle" class="primary" aria-label="Pause or play the loop">Pause</button>
    <button id="next" aria-label="Next comment">&#9654;</button>
    <span class="count"><em id="cnow">01</em> / <span id="ctot">15</span></span>
    <button id="fs" aria-label="Toggle full screen">Full screen</button>
    <div class="dots" id="dots" role="tablist" aria-label="Jump to a comment"></div>
  </div>
</main>

<script>
(function(){
  var QUOTES = [
    { t:"Our case was highly complex. The engineer was patient, thorough, and always responded with clear and structured guidance. Genuinely one of the best support experiences I have had. 5 stars without hesitation.", a:"Innova Solutions" },
    { t:"This was a high priority and time sensitive matter, and I wasn't expecting a resolution within 24 hours. The engineer responded quickly, provided all the information I needed, and helped me work through the troubleshooting steps that led to a successful resolution.", a:"KPMG New Zealand" },
    { t:"Support quickly reached out to be available, which is what our team likes best about UiPath Support. Your team has knowledge of many settings which helps guide us to quickly resolve issues. Thank you for being on call for us.", a:"Blue Cross Blue Shield of Nebraska" },
    { t:"The UiPath support team provided excellent assistance. The issue was understood quickly and resolved within the expected timeline. Communication was clear, and regular updates were shared throughout the process.", a:"Ericsson" },
    { t:"Outstanding support throughout our UiPath and Microsoft Teams integration. Deep technical knowledge, clear communication, and a proactive approach to problem solving.", a:"Uniao Brasileira de Educacao e Assistencia" },
    { t:"Excellent support during this case. They took the time to thoroughly investigate the issue, clearly explained the root cause, and guided us step by step toward the solution.", a:"Monash University" },
    { t:"Really helpful, and fixed the issue within an hour of opening the ticket. I really appreciated that, since it was a production issue.", a:"Reece" },
    { t:"Swift, timely, and responded twice before I could follow up. The first response was a general summary, and the follow up was more precise and informative. Great experience.", a:"Stuller" },
    { t:"The engineer quickly understood the requirements and provided effective support in resolving the issue, and also shared valuable insights about the deployment. Their expertise, willingness to help, and friendly approach were greatly appreciated.", a:"Pernod Ricard" },
    { t:"Great customer service skills, and my issue was resolved quickly. They went the extra mile and even reached out to another team to clarify an item still in preview.", a:"Fragomen" },
    { t:"Outstanding support and assistance throughout this ticket. Very helpful, responsive, and proactive in addressing my concerns. That dedication and willingness to help made the process smooth and efficient.", a:"Educational Testing Service" },
    { t:"Extremely helpful with our UiPath Insights decommissioning query. Clear guidance on the process, key requirements clarified, and the necessary steps shared in a timely and professional manner.", a:"La Trobe University" },
    { t:"I would like to sincerely appreciate the outstanding support in resolving our Orchestrator server issue. The prompt response, technical expertise, and dedication played a crucial role in identifying and fixing the problem efficiently.", a:"Karur Vysya Bank" },
    { t:"The engineer contacted me quickly with suggestions on how to fix the problem. When that didn't work, they set up a meeting and expertly found the issue. Thank you for the help.", a:"Massachusetts Mutual" },
    { t:"An excellent job providing the workaround to get our development environment to a stable state, plus clear instructions on how to permanently address the issue and monitor for future ones.", a:"U.S. Customs and Border Protection" }
  ];

  var HOLD = 9000;           // ms per quote
  var idx = 0, playing = true, start = 0, elapsed = 0, raf = null;

  var qEl = document.getElementById('quote');
  var mEl = document.getElementById('meta');
  var aEl = document.getElementById('acct');
  var railEl = document.getElementById('rail');
  var nowEl = document.getElementById('cnow');
  var totEl = document.getElementById('ctot');
  var dotsEl = document.getElementById('dots');
  var toggleEl = document.getElementById('toggle');
  var cardEl = document.getElementById('card');

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  totEl.textContent = pad(QUOTES.length);

  QUOTES.forEach(function(q,i){
    var d = document.createElement('i');
    d.setAttribute('role','tab');
    d.setAttribute('tabindex','0');
    d.setAttribute('aria-label','Comment ' + (i+1));
    d.addEventListener('click', function(){ go(i); });
    d.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(i);} });
    dotsEl.appendChild(d);
  });
  var dots = dotsEl.querySelectorAll('i');

  function pad(n){ return (n<10?'0':'') + n; }

  function paint(){
    qEl.textContent = QUOTES[idx].t;
    aEl.textContent = QUOTES[idx].a;
    nowEl.textContent = pad(idx+1);
    for(var i=0;i<dots.length;i++){
      if(i===idx){ dots[i].classList.add('on'); dots[i].setAttribute('aria-selected','true'); }
      else { dots[i].classList.remove('on'); dots[i].setAttribute('aria-selected','false'); }
    }
  }

  function swap(next){
    if(reduce){ idx = next; paint(); reset(); return; }
    qEl.classList.add('out'); mEl.classList.add('out');
    setTimeout(function(){
      idx = next;
      paint();
      qEl.classList.remove('out'); mEl.classList.remove('out');
      reset();
    }, 300);
  }

  function go(n){
    var next = (n + QUOTES.length) % QUOTES.length;
    if(next === idx){ reset(); return; }
    swap(next);
  }

  function reset(){ elapsed = 0; start = performance.now(); railEl.style.width = '0%'; }

  function tick(now){
    if(playing){
      var pct = Math.min(1, (elapsed + (now - start)) / HOLD);
      railEl.style.width = (pct*100).toFixed(2) + '%';
      if(pct >= 1){ swap((idx+1) % QUOTES.length); }
    }
    raf = requestAnimationFrame(tick);
  }

  function setPlaying(state){
    if(state === playing) return;
    if(state){ start = performance.now(); }
    else { elapsed += performance.now() - start; }
    playing = state;
    toggleEl.textContent = playing ? 'Pause' : 'Play';
  }

  document.getElementById('next').addEventListener('click', function(){ go(idx+1); });
  document.getElementById('prev').addEventListener('click', function(){ go(idx-1); });
  toggleEl.addEventListener('click', function(){ setPlaying(!playing); });

  document.getElementById('fs').addEventListener('click', function(){
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
  });

  // Hover holds the current quote so people can finish reading it.
  var wasPlaying = true;
  cardEl.addEventListener('mouseenter', function(){ wasPlaying = playing; setPlaying(false); });
  cardEl.addEventListener('mouseleave', function(){ if(wasPlaying) setPlaying(true); });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight'){ go(idx+1); }
    else if(e.key === 'ArrowLeft'){ go(idx-1); }
    else if(e.key === ' '){ e.preventDefault(); setPlaying(!playing); }
  });

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ setPlaying(false); }
  });

  paint();
  reset();
  raf = requestAnimationFrame(tick);
})();
</script>
